<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED Stats Output</title><link rel="stylesheet" href="/overlay.css"></head>
<body><main class="canvas">
<header class="top"><div class="brand">LED STATS STUDIO</div><div id="period">MATCH STATISTICS</div></header>
<section class="score" id="score"><div class="team"><div class="teamname" id="homeTeam">HOME</div><div class="points" id="homeScore">—</div></div><div class="mid">:</div><div class="team"><div class="teamname" id="awayTeam">AWAY</div><div class="points" id="awayScore">—</div></div></section>
<section class="lower"><div class="lower-title" id="graphicTitle">PLAYER STATISTICS</div><div id="stats" class="stats"><div class="placeholder">A mérkőzés statisztikái hamarosan megjelennek</div></div></section>
<footer class="bottom"><span>LED STATS STUDIO</span><span id="updated">WAITING FOR DATA</span></footer>
</main><script src="/overlay.js"></script></body></html>
